# Evita que o projeto Supabase (plano gratuito) seja pausado por inatividade.
# O Supabase pausa projetos gratuitos após ~7 dias sem acesso; esta rotina faz
# uma consulta leve a cada 3 dias.
#
# Configure em GitHub > Settings > Secrets and variables > Actions:
#   SUPABASE_URL       (ex.: https://xxxx.supabase.co)
#   SUPABASE_ANON_KEY  (chave anon pública)
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 12 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta leve ao banco
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/plantels?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP $status"
          test "$status" = "200"
